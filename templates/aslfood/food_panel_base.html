{% extends 'base.html' %}

{% block content %}
<div class="panel-container">
  
  <!-- AslFood Sidebar Navigation -->
  <aside class="sidebar" style="border-right: 1px solid rgba(245, 158, 11, 0.2);">
    <div style="padding: 0.75rem 0.9rem; margin-bottom: 0.5rem; background: rgba(245, 158, 11, 0.1); border-radius: var(--radius-md); border: 1px solid rgba(245, 158, 11, 0.2);">
      <div style="font-weight: 800; font-size: 0.9rem; color: #fbbf24; display: flex; align-items: center; gap: 0.4rem;">
        <i data-lucide="utensils"></i> AslFood Kitchen
      </div>
      <div style="font-size: 0.75rem; color: var(--text-muted);">Fast-Food & Restoran</div>
    </div>

    <a href="{% url 'aslfood_dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'aslfood_dashboard' %}active{% endif %}">
      <i data-lucide="chef-hat"></i>
      <span>Oshpaz Terminali</span>
    </a>

    <a href="{% url 'aslfood_menu_list' %}" class="nav-link {% if request.resolver_match.url_name == 'aslfood_menu_list' %}active{% endif %}">
      <i data-lucide="utensils-crossed"></i>
      <span>Taomlar Menyusi</span>
    </a>

    <a href="{% url 'dashboard' %}" class="nav-link">
      <i data-lucide="store"></i>
      <span>AslMarket Paneli</span>
    </a>

    <div style="margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border-light);">
      <a href="{% url 'aslfood_seed_data' %}" class="btn-details" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.5rem; color: #fbbf24;">
        <i data-lucide="sparkles"></i> Demo Taomlar Yuklash
      </a>
    </div>
  </aside>

  <!-- Main Content Slot -->
  <main class="panel-main">
    {% block panel_content %}{% endblock %}
  </main>
  
</div>
{% endblock %}
