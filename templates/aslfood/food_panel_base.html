{% extends 'base.html' %}

{% block content %}
<div class="container-fluid py-3 px-3 px-lg-4">
    <div class="row g-3">

        <!-- ═══ Sidebar ══════════════════════════════════════════════════════ -->
        <div class="col-12 col-lg-2 col-xl-2">
            <div class="d-flex flex-column gap-1 sticky-top bg-white rounded-3 border border-secondary-subtle p-2 shadow-sm"
                 style="top: 70px;">

                <!-- Logo blok -->
                <div class="d-flex align-items-center gap-2 px-2 py-2 mb-1 border-bottom border-secondary-subtle">
                    <div class="d-flex align-items-center justify-content-center rounded-2 bg-warning"
                         style="width:30px;height:30px;flex-shrink:0;">
                        <i class="fa-solid fa-fire-burner text-white" style="font-size:0.75rem;"></i>
                    </div>
                    <div class="lh-1">
                        <div class="fw-bold text-dark" style="font-size:0.85rem;">AslFood Panel</div>
                        <div class="text-muted" style="font-size:0.7rem;">Boshqaruv markazi</div>
                    </div>
                </div>

                <!-- Oshxona Terminali -->
                <a href="{% url 'aslfood_dashboard' %}"
                   class="btn text-start d-flex align-items-center gap-2 px-3 py-2 rounded-2
                          {% if request.resolver_match.url_name == 'aslfood_dashboard' %}
                          btn-warning text-dark fw-semibold
                          {% else %}
                          btn-light text-secondary border-0
                          {% endif %}">
                    <i class="fa-solid fa-fire-burner fa-fw"></i>
                    <span>Oshxona</span>
                    {% if new_orders %}
                    <span class="badge bg-danger ms-auto rounded-pill">{{ new_orders.count }}</span>
                    {% endif %}
                </a>

                <!-- Taomlar Menyusi -->
                <a href="{% url 'aslfood_menu_list' %}"
                   class="btn text-start d-flex align-items-center gap-2 px-3 py-2 rounded-2
                          {% if request.resolver_match.url_name == 'aslfood_menu_list' or request.resolver_match.url_name == 'aslfood_add_item' %}
                          btn-warning text-dark fw-semibold
                          {% else %}
                          btn-light text-secondary border-0
                          {% endif %}">
                    <i class="fa-solid fa-book-open fa-fw"></i>
                    <span>Taomlar</span>
                </a>

                <!-- Mijozlar -->
                <a href="{% url 'aslfood_customers' %}"
                   class="btn text-start d-flex align-items-center gap-2 px-3 py-2 rounded-2
                          {% if request.resolver_match.url_name == 'aslfood_customers' %}
                          btn-warning text-dark fw-semibold
                          {% else %}
                          btn-light text-secondary border-0
                          {% endif %}">
                    <i class="fa-solid fa-users fa-fw"></i>
                    <span>Mijozlar</span>
                </a>

                <!-- Storefront -->
                <a href="{% url 'storefront' %}"
                   class="btn text-start d-flex align-items-center gap-2 px-3 py-2 rounded-2
                          btn-light text-secondary border-0">
                    <i class="fa-solid fa-store fa-fw"></i>
                    <span>Storefront</span>
                </a>

                <hr class="border-secondary-subtle my-1">

                <!-- Seed (pastda, xavfli harakat sifatida ajratilgan) -->
                <a href="{% url 'aslfood_seed_data' %}"
                   class="btn btn-sm btn-outline-secondary text-muted d-flex align-items-center
                          justify-content-center gap-2 py-2 rounded-2">
                    <i class="fa-solid fa-database fa-fw" style="font-size:0.75rem;"></i>
                    <span style="font-size:0.75rem;">Demo data</span>
                </a>

            </div>
        </div>

        <!-- ═══ Asosiy kontent ════════════════════════════════════════════════ -->
        <div class="col-12 col-lg-10 col-xl-10">
            {% block panel_content %}{% endblock %}
        </div>

    </div>
</div>
{% endblock %}
