{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AslMarket.uz — Supermarket & AslFood Platformasi{% endblock %}</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Custom Glassmorphism CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-dark text-light">

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg glass-nav sticky-top py-2 px-3">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-white fs-4" href="{% url 'storefront' %}">
                <div class="bg-primary text-white p-2 rounded-3 d-flex align-items-center justify-content-center" style="width: 38px; height: 38px;">
                    <i class="fa-solid fa-store fs-5"></i>
                </div>
                <span>Asl<span class="text-primary">Market</span></span>
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle fs-6 rounded-pill">v3.0 ULTRA</span>
            </a>

            <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="collapse" data-bs-target="#topNav">
                <i class="fa-solid fa-bars fs-3"></i>
            </button>

            <div class="collapse navbar-collapse" id="topNav">
                <div class="navbar-nav ms-auto d-flex align-items-center gap-2 mt-3 mt-lg-0">
                    <a class="btn btn-outline-light rounded-pill px-3 d-flex align-items-center gap-2 {% if request.resolver_match.url_name == 'storefront' %}active bg-light text-dark{% endif %}" href="{% url 'storefront' %}">
                        <i class="fa-solid fa-bag-shopping"></i> Storefront (Do'kon)
                    </a>
                    <a class="btn btn-outline-warning rounded-pill px-3 d-flex align-items-center gap-2" href="{% url 'aslfood_dashboard' %}">
                        <i class="fa-solid fa-utensils"></i> AslFood Oshxona
                    </a>
                    <a class="btn btn-primary rounded-pill px-4 d-flex align-items-center gap-2 shadow" href="{% url 'dashboard' %}">
                        <i class="fa-solid fa-gauge-high"></i> Admin Panel
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Page Content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Toast Notification Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1090;">
        <div id="appToast" class="toast align-items-center text-white bg-success border-0 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center gap-2" id="toastMessage">
                    <i class="fa-solid fa-circle-check fs-5"></i> Bajarildi!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        lucide.createIcons();

        function showToast(message, isError = false) {
            const toastEl = document.getElementById('appToast');
            const toastMsg = document.getElementById('toastMessage');
            if (isError) {
                toastEl.className = "toast align-items-center text-white bg-danger border-0 shadow-lg";
                toastMsg.innerHTML = `<i class="fa-solid fa-circle-xmark fs-5"></i> ${message}`;
            } else {
                toastEl.className = "toast align-items-center text-white bg-success border-0 shadow-lg";
                toastMsg.innerHTML = `<i class="fa-solid fa-circle-check fs-5"></i> ${message}`;
            }
            const bsToast = new bootstrap.Toast(toastEl);
            bsToast.show();
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
