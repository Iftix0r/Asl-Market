{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AslMarket.uz - Do'kon & Boshqaruv Tizimi{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar">
    <a href="{% url 'storefront' %}" class="brand">
      <div class="brand-icon">
        <i data-lucide="store" style="width: 18px; height: 18px;"></i>
      </div>
      <span>AslMarket<span class="text-gradient">.uz</span></span>
      <span class="brand-badge">v2.0</span>
    </a>

    <div class="nav-actions">
      <a href="{% url 'storefront' %}" class="chip {% if request.resolver_match.url_name == 'storefront' %}active{% endif %}">
        <i data-lucide="shopping-bag" style="width: 14px; height: 14px;"></i>
        <span>Do'kon</span>
      </a>
      <a href="{% url 'aslfood_dashboard' %}" class="chip" style="color: #d97706; border-color: rgba(217,119,6,.25);">
        <i data-lucide="utensils" style="width: 14px; height: 14px;"></i>
        <span>AslFood</span>
      </a>
      <a href="{% url 'dashboard' %}" class="btn-nav-panel">
        <i data-lucide="layout-dashboard" style="width: 15px; height: 15px;"></i>
        <span>Panel</span>
      </a>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <div id="toast-container" class="toast-container"></div>

  <script>
    lucide.createIcons();

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      const icons = { success: '✅', danger: '❌', warning: '⚠️' };
      toast.innerHTML = `<span>${icons[type] || 'ℹ️'}</span><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(110%)';
        toast.style.transition = '0.3s';
        setTimeout(() => toast.remove(), 320);
      }, 3000);
    }

    document.addEventListener('DOMContentLoaded', () => lucide.createIcons());
  </script>

  {% block extra_js %}{% endblock %}
</body>
</html>
