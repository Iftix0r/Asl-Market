{% extends 'base.html' %}

{% block content %}
<div class="panel-container">
  
  <!-- Panel Sidebar Navigation -->
  <aside class="sidebar">
    <a href="{% url 'dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
      <i data-lucide="layout-dashboard"></i>
      <span>Dashboard</span>
    </a>

    <a href="{% url 'analytics_view' %}" class="nav-link {% if request.resolver_match.url_name == 'analytics_view' %}active{% endif %}">
      <i data-lucide="bar-chart-3"></i>
      <span>Tahlillar & Hisobot</span>
    </a>
    
    <a href="{% url 'debtors_list' %}" class="nav-link {% if request.resolver_match.url_name == 'debtors_list' %}active{% endif %}">
      <i data-lucide="users"></i>
      <span>Qarzdorlar Daftari</span>
    </a>
    
    <a href="{% url 'products_list' %}" class="nav-link {% if request.resolver_match.url_name == 'products_list' %}active{% endif %}">
      <i data-lucide="package"></i>
      <span>Mahsulotlar</span>
    </a>
    
    <a href="{% url 'pos_view' %}" class="nav-link {% if request.resolver_match.url_name == 'pos_view' %}active{% endif %}">
      <i data-lucide="shopping-bag"></i>
      <span>Kassa / POS</span>
    </a>
    
    <a href="{% url 'sales_history' %}" class="nav-link {% if request.resolver_match.url_name == 'sales_history' %}active{% endif %}">
      <i data-lucide="trending-up"></i>
      <span>Sotuvlar Tarixi</span>
    </a>

    <div style="margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border-light);">
      <a href="{% url 'seed_demo_data' %}" class="btn-details" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.5rem; color: #818cf8;">
        <i data-lucide="database"></i> Demo Ma'lumot Yuklash
      </a>
    </div>
  </aside>

  <!-- Main View Slot -->
  <main class="panel-main">
    {% block panel_content %}{% endblock %}
  </main>
  
</div>
{% endblock %}
